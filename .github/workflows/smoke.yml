name: GitHub Actions diagnostic
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    name: Verify runner starts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print successful startup
        run: |
          echo "A GitHub-hosted runner successfully started."
          echo "Repository: $GITHUB_REPOSITORY"
          echo "SHA: $GITHUB_SHA"
